<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>lark-doc element CI 冒烟</title>
</head>
<body>
  <div id="host"></div>
  <!-- element UMD 产物由 CI（或本地模拟）拷贝到本文件同目录 -->
  <script src="./lark-doc-element.umd.min.js"></script>
  <script>
    // 配置和 ready 监听先于连接；编辑器就绪后才暴露统一冒烟入口。
    var el = document.createElement('lark-doc')
    el.id = 'doc'
    el.options = {
      storage: 'none',
      contentFormat: 'html',
      // data-indent 缩进是折叠范围前提。
      content: '<h1>冒烟标题</h1><p data-indent="1">冒烟正文段落。</p>',
    }
    el.addEventListener('lark-doc-ready', function () { window.__larkDoc = el }, { once: true })
    document.getElementById('host').appendChild(el)
  </script>
</body>
</html>
