<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>lark-doc element CI 冒烟</title>
</head>
<body>
  <lark-doc id="doc" storage="none" content-format="html" content="&lt;h1&gt;冒烟标题&lt;/h1&gt;&lt;p data-indent=&quot;1&quot;&gt;冒烟正文段落。&lt;/p&gt;"></lark-doc>
  <!-- element UMD 产物由 CI（或本地模拟）拷贝到本文件同目录 -->
  <script src="./lark-doc-element.umd.min.js"></script>
  <script>
    // 初始化属性在连接前声明，关闭本地草稿，避免后台恢复内容或属性重建覆盖测试输入。
    // data-indent 缩进是折叠范围前提；暴露统一的冒烟入口。
    var el = document.getElementById('doc')
    window.__larkDoc = el
  </script>
</body>
</html>
