name: CI

# requirements/09 P0-08：lint + 单测 + 四产物 build + size-limit。
# 浏览器行为断言在 e2e.yml；demo 宿主（vue2/vue3/react）不在本仓库，CI 只跑仓库内可复现的部分。

on:
  push:
    branches: [master, 'next/**']
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-unit-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # 先构建、后单测 + size。原因：单测（plugin-contract）和 size-limit（collab / lite 两档）
      # 读的都是**真实产物**，旧顺序在干净仓库上必红两处：
      #   1. 先单测 → `[lark-doc] 找不到 dist 目录`（CI #15/#16 红在这里）；
      #   2. 只跑 4 个 target 就测 size → `Size Limit can't find files at
      #      dist/lark-doc-collab.esm.js` / `dist/lark-doc-lite.esm.js`。
      # 所以下面这份构建清单必须与 package.json 的 check:artifacts（scripts/ensure-artifacts.mjs）
      # 的 ARTIFACTS 对齐 —— 那边是发布链路唯一真源，漏一个这里就会红。
      # 本地看不出的原因：npm run check 走 check:gate（deploy/code/ui/lint），本就不含单测。
      - name: Build (commonjs)
        run: npm run build

      - name: Build (umd-min)
        run: npm run build:umd

      - name: Build (esm)
        run: npm run build:esm

      - name: Build (element umd)
        run: npm run build:element

      - name: Build (collab)
        run: npm run build:collab

      - name: Build (lite)
        run: npm run build:lite

      - name: Build (features)
        run: npm run build:features

      - name: Build (adapters)
        run: npm run build:adapters

      - name: Build (plugin)
        run: npm run build:plugin

      - name: Unit tests (vitest)
        run: npm run check:unit

      - name: Size limit
        run: npm run size
