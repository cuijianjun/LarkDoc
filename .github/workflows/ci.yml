name: CI

# requirements/09 P0-08：lint + 单测 + 四产物 build + size-limit。
# 浏览器行为断言在 e2e.yml；demo 宿主（vue2/vue3/react）不在本仓库，CI 只跑仓库内可复现的部分。

on:
  push:
    branches: [master, 'next/**']
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-unit-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Tests and size checks read real artifacts, including full/lite and adapters.
      # element runtime 单文件约 10.7 MB，Rollup 打它时默认堆（4 GB）会 OOM，和 deploy-docs 对齐到 8 GB。
      - name: Build all Rollup artifacts
        env:
          NODE_OPTIONS: --max_old_space_size=8192
        run: npm run build:all

      - name: Unit tests (vitest)
        run: npm run check:unit

      # 以下三组门禁此前只存在于本地 `npm run check`，CI 没接，导致 lite 体积、
      # legacy 语法、vditor 契约、核心与工作区行为红了半个月没人发现。
      - name: Core and workspace behaviour
        run: npm run check:lark-doc

      # check:artifacts 的首步 ensure-artifacts 是给 prepack 用的幂等重建，CI 刚
      # build:all 过，没必要再花三分钟重建，这里只跑它后面的四项只读断言。
      # 最后一项 check-rollup-artifacts --size 等价于原来的 Size limit 步骤。
      - name: Artifact contracts (lite size / legacy syntax / vditor HTML / size limit)
        run: npm run check:lite && npm run check:legacy && npm run check:vditor && npm run size

      # check:offline 会起 headless Chromium 真渲染断网 mermaid，因此本 job 需要浏览器。
      - name: Install Playwright Chromium
        run: |
          npm i --no-save playwright@1.49.0
          npx playwright install --with-deps chromium

      - name: Deploy contracts (node14 / offline mermaid / exports / ecs / session)
        run: npm run check:deploy
