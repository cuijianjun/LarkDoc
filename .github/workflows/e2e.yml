name: E2E Smoke

# requirements/09 P0-08：Playwright 冒烟。三端 demo 宿主（apps/vue2-webpack-node14、
# apps/vue3-vite、apps/react-vite）不在本仓库，无法在 CI 起服务；这里对 element UMD
# 产物跑同一套冒烟链路（scripts/e2e/host.html + scripts/verify-smoke.js）：
# 挂载 → 键盘输入 → 标题折叠 → 插入表格 → getJSON。

on:
  push:
    branches: [master, 'next/**']
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  element-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build element umd
        run: npm run build:element

      - name: Install Playwright Chromium
        run: |
          npm i --no-save playwright@1.49.0
          npx playwright install --with-deps chromium

      - name: Assemble smoke host directory
        run: |
          mkdir -p .e2e-smoke
          cp dist/lark-doc-element.umd.min.js .e2e-smoke/
          cp scripts/e2e/host.html .e2e-smoke/index.html

      - name: Start static server
        run: |
          python3 -m http.server 8099 --directory .e2e-smoke &
          sleep 2

      - name: Smoke (mount → type → fold → table → getJSON)
        run: node scripts/verify-smoke.js ci http://127.0.0.1:8099/
