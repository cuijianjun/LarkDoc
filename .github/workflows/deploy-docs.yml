name: Deploy Docs to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'DEVELOPMENT.md'
      - 'dev/**'
      - 'src/**'
      - 'scripts/**'
      - 'vendor/**'
      - 'style.css'
      - 'rollup.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup library dependencies runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install library dependencies
        run: npm ci

      - name: Install example dependencies
        run: node scripts/demo-build-examples.mjs --install

      - name: Setup library build runtime
        uses: actions/setup-node@v4
        with:
          node-version: 14.21.3

      - name: Build editor and sync demo assets
        env:
          NODE_OPTIONS: --max_old_space_size=8192
        run: |
          npm run build:all
          node scripts/demo-sync-vendor.mjs
          node scripts/demo-sync-vendor.mjs --check
          node scripts/demo-build-examples.mjs --webpack

      - name: Setup modern example runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Vue3, React and static examples
        run: |
          node scripts/demo-build-examples.mjs --vite
          node scripts/demo-build-examples.mjs --check

      - name: Setup docs runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        working-directory: docs
        run: npm ci

      - name: Build with VitePress
        working-directory: docs
        run: npm run docs:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
